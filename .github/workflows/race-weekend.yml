name: Race weekend

# Predicts each race after qualifying and ingests the result + retrains after
# the race (scripts/ci_tick.py decides what is due), then commits the updated
# data, model and site/f1-predictions.json. The website copies that JSON.
#
# Scheduled workflows on public repos are disabled after 60 days without a
# commit, which the December-February off-season will trigger: re-enable it
# from the Actions tab before the first race weekend.

on:
  schedule:
    # Hourly Saturday to Monday (UTC): qualifying, race and results publishing
    - cron: '23 * * * 6,0,1'
    # Tuesday catch-up in case results were published late
    - cron: '23 6 * * 2'
  workflow_dispatch:

concurrency:
  group: race-weekend
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # commit data, model and site JSON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: fastf1-${{ github.run_id }}
          restore-keys: fastf1-

      - name: Run tick
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_tick.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/predictions data/results \
                  models/xgb_race.pkl models/active_model.json models/holdout_metrics.json \
                  site/f1-predictions.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: race weekend update [skip ci]"
            git push
          fi
